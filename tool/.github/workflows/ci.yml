name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests (unittest)
        run: python -m unittest discover -s tests -v
      - name: Unit tests (pytest)
        run: python -m pytest -q
      - name: CLI smoke tests
        run: |
          python -m kvc_lifecycle.cli check examples/normal_recv.jsonl
          python -m kvc_lifecycle.cli check examples/stale_send.jsonl; test $? -eq 1
          python -m kvc_lifecycle.cli audit examples/delay_free.jsonl
          python -m kvc_lifecycle.cli cost --target stale_send
          python -m kvc_lifecycle.cli cost --target stale_send --delivery merged
          python -m kvc_lifecycle.cli aggregate examples/aggregation_duplicate.json
      - name: pytest plugin smoke test
        run: |
          python -m pytest -q --kvc-trace examples/normal_recv.jsonl
          python -m pytest -q --kvc-trace examples/stale_send.jsonl --kvc-fail-on-violation; test $? -eq 1


