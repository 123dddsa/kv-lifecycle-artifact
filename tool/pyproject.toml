[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kvc-lifecycle"
version = "0.8.0"
description = "Scoped lifecycle contracts for KV-cache transfer completion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KVC Lifecycle contributors" }]
keywords = ["kv-cache", "llm-serving", "testing", "reliability", "contract"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
kvc = "kvc_lifecycle.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points.pytest11]
kvc-lifecycle = "kvc_lifecycle.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kvc_lifecycle = ["py.typed"]









